[package]
name = "schemask_from"
version = "0.1.3"
edition = "2024"
license = "ISC"
repository = "https://github.com/andrewbaxter/schemask"
readme = "../../readme.md"
description = "Simple but powerful data schemas (from_schemask! macro crate)"

[lib]
proc-macro = true

[dependencies]
schemask_core = { version = "0.1.3", path = "../schemask_core" }
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }

[lints.clippy]
all = "allow"
