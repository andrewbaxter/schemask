[workspace]
members = ["test_gen_rust", "test_gen_typescript"]

[package]
name = "schemask"
version = "0.1.0"
edition = "2024"

[dependencies]
aargvark = { version = "0.9.6", features = ["serde_json"] }
flowcontrol = "0.2.3"
genemichaels-lib = "0.8.6"
loga = "0.5.4"
proc-macro2 = "1"
quote = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
