[workspace]
members = ["schemask_core", "schemask_derive", "schemask_from", "test_gen_rust", "test_gen_typescript"]

[package]
name = "schemask"
version = "0.1.3"
edition = "2024"
license = "ISC"
repository = "https://github.com/andrewbaxter/schemask"
readme = "../readme.md"
description = "Simple but powerful data schemas"

[dependencies]
schemask_core = { version = "0.1.3", path = "schemask_core" }
schemask_derive = { version = "0.1.3", path = "schemask_derive" }
schemask_from = { version = "0.1.3", path = "schemask_from" }
aargvark = { version = "0.9", features = ["serde_json"] }
flowcontrol = "0.2"
loga = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "allow"
