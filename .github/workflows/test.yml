on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: source/test_gen_java/pom.xml
      - run: cargo test --workspace
        working-directory: source

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build rust-ai-lint
        run: |
          git clone --depth 1 https://github.com/andrewbaxter/rust-ai-lint "$RUNNER_TEMP/rust-ai-lint"
          nix-build --out-link "$RUNNER_TEMP/rust-ai-lint-result" "$RUNNER_TEMP/rust-ai-lint"
      - name: Lint
        run: |
          # The linter rewrites files in place and exits non-zero if problems remain, so
          # also fail if it had to change anything.
          "$RUNNER_TEMP/rust-ai-lint-result/bin/rust-ai-lint"
          git diff --exit-code
